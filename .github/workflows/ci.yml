name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:

  backend:
    name: Backend check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile backend/app.py && echo "app.py OK"

      - name: Check no secrets in code
        run: |
          if grep -rn "AIza\|sk-ant\|sk-proj" backend/app.py; then
            echo "hardcoded secret found"
            exit 1
          fi
          echo "no secrets found"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        run: |
          cd frontend
          npm run build